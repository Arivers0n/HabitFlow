name: Screenshots

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Самый новый Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild build -project HabitFlow.xcodeproj -scheme HabitFlow -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/HabitFlow.app

      - name: Симулятор
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/HabitFlow.app

      - name: Снимки
        run: bash .github/scripts/shots.sh

      - name: Журнал приложения
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 6m --predicate 'process == "HabitFlow"' --style compact 2>/dev/null \
            | grep -i -E "error|fault|shader|metal|crash|fatal" | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
