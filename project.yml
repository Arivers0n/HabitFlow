name: HabitFlow
options:
  bundleIdPrefix: com.ariverson
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  HabitFlow:
    type: application
    platform: iOS
    sources:
      - path: HabitFlow
    info:
      path: HabitFlow/Info.plist
      properties:
        CFBundleDisplayName: HabitFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Напарник читает сон, шаги и тренировки, чтобы мягко подсказывать, когда лечь спать и сколько пить воды. Данные остаются на устройстве.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.ariverson.habitflow
            CFBundleURLSchemes: [habitflow]
    entitlements:
      path: HabitFlow/HabitFlow.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ariverson.habitflow]
    dependencies:
      - target: HabitFlowWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariverson.habitflow
        PRODUCT_NAME: HabitFlow
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Emerald AppIcon-Amethyst AppIcon-Ocean AppIcon-Sunset AppIcon-Neon AppIcon-Autumn AppIcon-Winter AppIcon-Mono AppIcon-Light AppIcon-Bronze AppIcon-Silver AppIcon-Gold AppIcon-Diamond"
        ENABLE_PREVIEWS: YES

  HabitFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HabitFlowWidgets
        excludes:
          - Info.plist
          - HabitFlowWidgets.entitlements
      - path: HabitFlow/Domain
      - path: HabitFlow/Data/WidgetStorage.swift
      - path: HabitFlow/DesignSystem/WidgetRenderer.swift
    info:
      path: HabitFlowWidgets/Info.plist
      properties:
        CFBundleDisplayName: HabitFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HabitFlowWidgets/HabitFlowWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ariverson.habitflow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ariverson.habitflow.widgets
        PRODUCT_NAME: HabitFlowWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
